<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/main.css">
    <title>Organização viver - Cadastro</title>
</head>
<body>
       <script src="js/app.js" defer></script>
<script src="js/formValidation.js" defer></script>
<script src="js/storage.js" defer></script>

    <header>
        <h1>Cadastro</h1>
        <nav>
             <a href="index.html">Inicio</a>
             <a href="projetos.html">projetos</a> |
             <a href="cadastro.html">cadastro</a>    
        </nav>
    </header>

   <main>
    <form action="#" method="post">
        <fieldset>
            <legend>Dados Pessoais</legend>

            <label for="nome">Nome completo *</label><br>
            <input type="text" id="nome" name="nome" required><br><br>

            <label for="cpf">CPF *</label><br>
            <input type="text" id="cpf" name="cpf" required><br><br>

            <label for="email">Email *</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="telefone">Telefone *</label><br>
            <input type="tel" id="telefone" name="telefone" required><br><br>

            <label for="nascimento">nascimento *</label><br>
            <input type="date" id="nascimento" name="nascimento" required><br><br>
        </fieldset>

        <fieldset>
            <legend>Endereço</legend>
            <label for="Endereço">Endereço *</label>
            <input type="text" id="Endereço" name="Endereço" required><br><br>

            <label for="cep">CEP *</label>
            <input type="text" id="cep" name="cep" required
            pattern="\d{5}-\d{3}"
            placeholder="00000-000"><br><br>

            <label for="cidade">Cidade *</label>
            <input type="text" id="cidade" name="cidade" required><br><br>

            <label for="estado">Estado *</label>
            <select id="estado" name="estado" required>
                <option value="">Selecione</option>
                <option value="SP">São Paulo</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="MG">Minas Gerais</option>
                <option value="ES">Espírito Santo</option>
            </select><br><br>
        </fieldset>

        <fieldset>
            <legend>Preferências</legend>
            <label for="tipo">Quero Participar como:</label><br>
            <select id="tipo" name="tipo" required>
                <option value="">Selecione</option>
                <option value="voluntario">Voluntário</option>
                <option value="doador">Doador</option>
                <option value="ambos">Ambos</option>
            </select><br><br>

            <p>Áreas de Interesse:</p>
            <label><input type="checkbox" id="acolhimento" name="interesse" value="acolhimento"> acolhimento</label><br>
            <label><input type="checkbox" id="educacao" name="interesse" value="educacao"> educação</label><br>
        </fieldset>

        <br>
        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
    </form>
   </main>

   <footer>
    <p>&copy; 2025 Organização Viver</p>
    </footer>   


</body>
</html>
